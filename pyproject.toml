[project]
name = "jev-darija-eval"
version = "0.1.0"
description = "Reproducible Jev and Laya benchmark for Moroccan Darija sentiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0",
    "modal>=1.5.5,<2",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "typer>=0.15",
    "typesafe-sdk>=0.7,<0.8",
]

[project.scripts]
darija-eval = "darija_eval.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darija_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
